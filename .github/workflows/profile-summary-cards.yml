name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile-summary-card-output/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: Qiuner
          BRANCH_NAME: main
          UTC_OFFSET: 8
          AUTO_PUSH: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: github

      - name: Embed avatar in stats card
        run: python .github/scripts/embed_stats_avatar.py

      - name: Commit and push if changed
        run: |
          git diff --quiet && exit 0
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add profile-summary-card-output README.md
          git commit -m "Update profile summary cards"
          git push
